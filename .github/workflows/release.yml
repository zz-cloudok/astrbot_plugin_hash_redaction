name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: |
          python -m py_compile main.py
          python -c "import json; json.load(open('_conf_schema.json', encoding='utf-8'))"
      - name: Package
        run: |
          mkdir -p dist/astrbot_plugin_hash_redaction
          cp main.py metadata.yaml README.md CHANGELOG.md _conf_schema.json dist/astrbot_plugin_hash_redaction/
          cd dist
          zip -r astrbot_plugin_hash_redaction-${GITHUB_REF_NAME}.zip astrbot_plugin_hash_redaction
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.zip
